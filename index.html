<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カメラ試作</title>
<style>
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; background: #000; color: #fff; }
  #wrap { position: relative; width: 100vw; height: 100vw; overflow: hidden; background: #111; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #bar { padding: 12px; display: flex; gap: 16px; align-items: center; justify-content: center; }
  #shutter { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #888; background: #fff; }
  #shutter:active { background: #bbb; }
  #count { min-width: 50px; text-align: center; font-size: 18px; }
  .s { padding: 12px 16px; font-size: 16px; border-radius: 10px; border: 0; background: #1a73e8; color: #fff; }
  #thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px; }
  #thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  #info { font-size: 14px; padding: 8px 12px; color: #ddd; line-height: 1.6; white-space: pre-wrap; }
  #big img { width: 100%; display: block; }
</style>
</head>
<body>
  <div id="wrap"><video id="v" autoplay playsinline muted></video></div>
  <div id="bar">
    <span id="count">0枚</span>
    <button id="shutter" aria-label="シャッター"></button>
    <button class="s" id="show">最後の1枚を拡大</button>
  </div>
  <div id="thumbs"></div>
  <div id="info">カメラを起動しています…</div>
  <div id="big"></div>
<script>
  const v = document.getElementById('v');
  const info = document.getElementById('info');
  const shots = [];

  async function start() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 4032 }, height: { ideal: 3024 } },
        audio: false
      });
      v.srcObject = stream;
      await v.play();
      const s = stream.getVideoTracks()[0].getSettings();
      const side = Math.min(s.width || 0, s.height || 0);
      info.textContent = 'カメラ起動OK\n映像の解像度：' + s.width + '×' + s.height + '\n正方形で保存できる最大サイズ：' + side + '×' + side;
    } catch (e) {
      info.textContent = 'カメラを起動できませんでした\n' + e.name + '：' + e.message;
    }
  }

  document.getElementById('shutter').onclick = function () {
    const w = v.videoWidth, h = v.videoHeight;
    if (!w) return;
    const side = Math.min(w, h);
    const c = document.createElement('canvas');
    c.width = side;
    c.height = side;
    c.getContext('2d').drawImage(v, (w - side) / 2, (h - side) / 2, side, side, 0, 0, side, side);
    const url = c.toDataURL('image/jpeg', 0.9);
    shots.push({ url: url, side: side });
    const img = document.createElement('img');
    img.src = url;
    document.getElementById('thumbs').appendChild(img);
    document.getElementById('count').textContent = shots.length + '枚';
  };

  document.getElementById('show').onclick = function () {
    if (!shots.length) { info.textContent += '\n先に撮影してください'; return; }
    const last = shots[shots.length - 1];
    const big = document.getElementById('big');
    big.innerHTML = '';
    const p = document.createElement('div');
    p.id = 'info';
    p.textContent = '最後の1枚（' + last.side + '×' + last.side + '）。長押しで「写真」に保存し、拡大して画質を確認してください。';
    const img = document.createElement('img');
    img.src = last.url;
    big.appendChild(p);
    big.appendChild(img);
  };

  start();
</script>
</body>
</html>
