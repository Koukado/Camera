<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="幸華堂カメラ">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>幸華堂カメラ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; background: #000; color: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px; color: #ccc; }
  header span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button { flex-shrink: 0; background: none; border: 1px solid #555; color: #ccc; border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  #wrap { position: relative; width: 100vw; height: 100vw; max-width: 600px; max-height: 600px; margin: 0 auto; overflow: hidden; background: #111; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; }
  #bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; }
  #count { width: 84px; font-size: 18px; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #888; background: #fff; }
  #shutter:active { background: #bbb; }
  #shutter:disabled { opacity: .35; }
  #save { width: 84px; height: 56px; border-radius: 12px; border: 0; background: #1a73e8; color: #fff; font-size: 14px; font-weight: 600; line-height: 1.3; }
  #save:disabled { opacity: .35; }
  #thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px 8px; }
  .t { position: relative; }
  .t img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 4px; }
  .t span { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,.65); font-size: 12px; padding: 1px 6px; border-radius: 8px; }
  .t button { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.75); color: #fff; font-size: 15px; padding: 0; }
  #msg { padding: 10px 16px; font-size: 15px; line-height: 1.6; min-height: 2em; }
  .ok { color: #7ee787; }
  .err { color: #ff7b72; }
  #retry { display: none; margin: 0 16px 16px; padding: 14px; width: calc(100% - 32px); border: 0; border-radius: 10px; background: #c62828; color: #fff; font-size: 16px; }
  #setup { display: none; padding: 24px 20px; }
  #setup h1 { font-size: 20px; margin: 0 0 8px; }
  #setup p { color: #bbb; font-size: 14px; line-height: 1.6; }
  #setup label { display: block; margin: 18px 0 6px; font-size: 15px; }
  #setup input { width: 100%; padding: 12px; font-size: 17px; border-radius: 10px; border: 1px solid #555; background: #111; color: #fff; }
  #setup button { margin-top: 24px; width: 100%; padding: 14px; font-size: 17px; border: 0; border-radius: 12px; background: #1a73e8; color: #fff; }
  #setupMsg { margin-top: 12px; }
</style>
</head>
<body>

<section id="setup">
  <h1>幸華堂カメラ 初期設定</h1>
  <p>最初の1回だけ入力します。この端末に保存されます。</p>
  <label for="inStaff">撮影担当（AppSheetにログインするメールアドレス）</label>
  <input id="inStaff" type="email" autocomplete="email" autocapitalize="off" spellcheck="false">
  <button id="setupSave">保存して始める</button>
  <div id="setupMsg"></div>
</section>

<section id="main" style="display:none">
  <header>
    <span id="who"></span>
    <button id="toSetup">設定</button>
  </header>
  <div id="wrap"><video id="v" autoplay playsinline muted></video><div id="flash"></div></div>
  <div id="bar">
    <span id="count">0 / 10枚</span>
    <button id="shutter" aria-label="シャッター"></button>
    <button id="save" disabled>保存して<br>次へ</button>
  </div>
  <div id="thumbs"></div>
  <div id="msg">カメラを起動しています…</div>
  <button id="retry">もう一度送信する</button>
</section>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbwjRrZqs0XHFISQoIV6ewMN8NPKPPyau6P5B2KgkwUoXnD8RdmF2z3lg5_3TNdpkCmy_Q/exec';
  const MAX = 10;
  const SIZE = 1600;

  const $ = id => document.getElementById(id);
  const v = $('v');
  let shots = [];
  let pendingId = null;
  let busy = false;

  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function store(k, val) { try { localStorage.setItem(k, val); } catch (e) {} }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function todayCount() { return load('kk_day') === todayKey() ? Number(load('kk_cnt') || 0) : 0; }
  function addToday() { store('kk_day', todayKey()); store('kk_cnt', String(todayCount() + 1)); }

  function msg(text, cls) { $('msg').textContent = text; $('msg').className = cls || ''; }

  async function post(body) {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '保存に失敗しました');
    return j;
  }

  /* ---------- 初期設定 ---------- */
  function showSetup() {
    stopCamera();
    $('main').style.display = 'none';
    $('setup').style.display = 'block';
    $('inStaff').value = load('kk_staff');
  }

  $('setupSave').onclick = async function () {
    const staff = $('inStaff').value.trim().toLowerCase();
    const m = $('setupMsg');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(staff)) {
      m.textContent = 'メールアドレスを正しく入力してください';
      m.className = 'err';
      return;
    }
    m.textContent = '確認中…';
    m.className = '';
    try {
      await post({ action: 'check', staff: staff });
      store('kk_staff', staff);
      showMain();
    } catch (e) {
      m.textContent = e.message;
      m.className = 'err';
    }
  };

  $('toSetup').onclick = function () {
    if (shots.length && !confirm('撮影中の写真は消えます。設定画面に移りますか？')) return;
    shots = [];
    pendingId = null;
    render();
    showSetup();
  };

  /* ---------- カメラ ---------- */
  let stream = null;

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 4032 }, height: { ideal: 3024 } },
        audio: false
      });
      v.srcObject = stream;
      await v.play();
      if (!busy && !pendingId) msg('撮影できます。最大10枚まで撮れます。');
    } catch (e) {
      msg('カメラを起動できませんでした（' + e.name + '）。iPhoneの設定でSafariのカメラを「許可」にしてください。', 'err');
    }
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && $('main').style.display !== 'none') {
      const live = stream && stream.getVideoTracks().some(t => t.readyState === 'live');
      if (!live) startCamera();
    }
  });

  function showMain() {
    $('setup').style.display = 'none';
    $('main').style.display = 'block';
    updateWho();
    render();
    startCamera();
  }

  function updateWho() {
    $('who').textContent = '担当：' + load('kk_staff') + '　本日 ' + todayCount() + '件';
  }

  /* ---------- 撮影 ---------- */
  $('shutter').onclick = function () {
    if (busy || pendingId || shots.length >= MAX) return;
    const w = v.videoWidth, h = v.videoHeight;
    if (!w) return;
    const side = Math.min(w, h);
    const out = Math.min(SIZE, side);
    const c = document.createElement('canvas');
    c.width = out;
    c.height = out;
    c.getContext('2d').drawImage(v, (w - side) / 2, (h - side) / 2, side, side, 0, 0, out, out);
    shots.push(c.toDataURL('image/jpeg', 0.85));
    const f = $('flash');
    f.style.opacity = '0.7';
    setTimeout(function () { f.style.opacity = '0'; }, 80);
    render();
  };

  function render() {
    const box = $('thumbs');
    box.innerHTML = '';
    shots.forEach(function (url, i) {
      const d = document.createElement('div');
      d.className = 't';
      const img = document.createElement('img');
      img.src = url;
      const n = document.createElement('span');
      n.textContent = i + 1;
      d.appendChild(img);
      d.appendChild(n);
      if (!busy && !pendingId) {
        const x = document.createElement('button');
        x.textContent = '×';
        x.setAttribute('aria-label', (i + 1) + '枚目を削除');
        x.onclick = function () {
          if (confirm((i + 1) + '枚目を削除しますか？')) { shots.splice(i, 1); render(); }
        };
        d.appendChild(x);
      }
      box.appendChild(d);
    });
    $('count').textContent = shots.length + ' / ' + MAX + '枚';
    $('shutter').disabled = busy || !!pendingId || shots.length >= MAX;
    $('save').disabled = busy || !!pendingId || shots.length === 0;
    $('retry').style.display = pendingId && !busy ? 'block' : 'none';
  }

  /* ---------- 送信（まとめて1回） ---------- */
  function newId() {
    const a = new Uint8Array(4);
    crypto.getRandomValues(a);
    return Array.from(a).map(b => ('0' + b.toString(16)).slice(-2)).join('');
  }

  async function upload() {
    busy = true;
    render();
    const total = shots.length;
    const started = Date.now();
    const body = { action: 'photos', staff: load('kk_staff'), id: pendingId, images: shots };
    msg('送信中…（' + total + '枚）画面を閉じないでください');
    try {
      try { await post(body); }
      catch (e) { msg('再送信中…（' + total + '枚）'); await post(body); }
      const sec = Math.round((Date.now() - started) / 1000);
      busy = false;
      pendingId = null;
      shots = [];
      addToday();
      updateWho();
      render();
      msg('保存しました（' + total + '枚・' + sec + '秒）。管理番号は約1分後に付きます。続けて次の商品を撮影できます。', 'ok');
    } catch (e) {
      busy = false;
      render();
      msg('送信できませんでした：' + e.message + '　電波の良い場所で「もう一度送信する」を押してください。', 'err');
    }
  }

  $('save').onclick = function () {
    if (!shots.length || busy) return;
    pendingId = newId();
    upload();
  };

  $('retry').onclick = function () { if (pendingId && !busy) upload(); };

  window.addEventListener('beforeunload', function (e) {
    if (shots.length) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- 開始 ---------- */
  if (load('kk_staff')) showMain(); else showSetup();
</script>
</body>
</html>
