<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="幸華堂カメラ">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>幸華堂カメラ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", sans-serif; background: #000; color: #fff; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; font-size: 13px; color: #ccc; }
  header span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button { flex-shrink: 0; background: none; border: 1px solid #555; color: #ccc; border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  #queue { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; font-size: 13px; min-height: 32px; }
  #queue.idle { color: #7ee787; }
  #queue.busy { color: #f2cc60; }
  #queue.fail { color: #ff7b72; }
  #queue button { flex-shrink: 0; display: none; background: #c62828; border: 0; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  #wrap { position: relative; width: 100vw; height: 100vw; max-width: 600px; max-height: 600px; margin: 0 auto; overflow: hidden; background: #111; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; }
  #bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; }
  #count { width: 84px; font-size: 18px; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #888; background: #fff; }
  #shutter:active { background: #bbb; }
  #shutter:disabled { opacity: .35; }
  #save { width: 84px; height: 56px; border-radius: 12px; border: 0; background: #1a73e8; color: #fff; font-size: 14px; font-weight: 600; line-height: 1.3; }
  #save:disabled { opacity: .35; }
  #thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 4px 8px; }
  .t { position: relative; }
  .t img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 4px; }
  .t span { position: absolute; top: 2px; left: 2px; background: rgba(0,0,0,.65); font-size: 12px; padding: 1px 6px; border-radius: 8px; }
  .t button { position: absolute; top: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.75); color: #fff; font-size: 15px; padding: 0; }
  #msg { padding: 10px 16px; font-size: 15px; line-height: 1.6; min-height: 2em; }
  .ok { color: #7ee787; }
  .err { color: #ff7b72; }
  #setup { display: none; padding: 24px 20px; }
  #setup h1 { font-size: 20px; margin: 0 0 8px; }
  #setup p { color: #bbb; font-size: 14px; line-height: 1.6; }
  #setup label { display: block; margin: 18px 0 6px; font-size: 15px; }
  #setup input { width: 100%; padding: 12px; font-size: 17px; border-radius: 10px; border: 1px solid #555; background: #111; color: #fff; }
  #setup button { margin-top: 24px; width: 100%; padding: 14px; font-size: 17px; border: 0; border-radius: 12px; background: #1a73e8; color: #fff; }
  #setupMsg { margin-top: 12px; }
</style>
</head>
<body>

<section id="setup">
  <h1>幸華堂カメラ 初期設定</h1>
  <p>最初の1回だけ入力します。この端末に保存されます。</p>
  <label for="inStaff">撮影者コード（管理者から受け取ったもの）</label>
  <input id="inStaff" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例：kk-abc123">
  <button id="setupSave">保存して始める</button>
  <div id="setupMsg"></div>
</section>

<section id="main" style="display:none">
  <header>
    <span id="who"></span>
    <button id="toSetup">設定</button>
  </header>
  <div id="queue" class="idle"><span id="qText">送信待ちはありません</span><button id="qRetry">今すぐ再送信</button></div>
  <div id="wrap"><video id="v" autoplay playsinline muted></video><div id="flash"></div></div>
  <div id="bar">
    <span id="count">0 / 10枚</span>
    <button id="shutter" aria-label="シャッター"></button>
    <button id="save" disabled>保存して<br>次へ</button>
  </div>
  <div id="thumbs"></div>
  <div id="msg">カメラを起動しています…</div>
</section>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbwjRrZqs0XHFISQoIV6ewMN8NPKPPyau6P5B2KgkwUoXnD8RdmF2z3lg5_3TNdpkCmy_Q/exec';
  const MAX = 10;
  const SIZE = 1600;
  const DB_NAME = 'kk_camera';
  const STORE = 'queue';

  const $ = id => document.getElementById(id);
  const v = $('v');
  let shots = [];

  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function store(k, val) { try { localStorage.setItem(k, val); } catch (e) {} }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function todayCount() { return load('kk_day') === todayKey() ? Number(load('kk_cnt') || 0) : 0; }
  function addToday() { store('kk_day', todayKey()); store('kk_cnt', String(todayCount() + 1)); }

  function msg(text, cls) { $('msg').textContent = text; $('msg').className = cls || ''; }

  function newId() {
    const a = new Uint8Array(4);
    crypto.getRandomValues(a);
    return Array.from(a).map(b => ('0' + b.toString(16)).slice(-2)).join('');
  }

  async function post(body, timeoutMs) {
    const ctl = new AbortController();
    const timer = setTimeout(function () { ctl.abort(); }, timeoutMs || 120000);
    try {
      const r = await fetch(API, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || '保存に失敗しました');
      return j;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('通信がタイムアウトしました');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  /* ---------- 送信待ちの保管（iPhone内） ---------- */
  let db = null;
  let useMem = false;
  let memQueue = [];

  function openDB() {
    return new Promise(function (resolve, reject) {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE, { keyPath: 'key' }); };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }

  function qAdd(item) {
    if (useMem) { memQueue.push(item); return Promise.resolve(); }
    return new Promise(function (resolve, reject) {
      const t = db.transaction(STORE, 'readwrite');
      t.objectStore(STORE).put(item);
      t.oncomplete = function () { resolve(); };
      t.onerror = function () { reject(t.error); };
    });
  }

  function qFirst() {
    if (useMem) return Promise.resolve(memQueue[0] || null);
    return new Promise(function (resolve, reject) {
      const r = db.transaction(STORE, 'readonly').objectStore(STORE).openCursor();
      r.onsuccess = function () { resolve(r.result ? r.result.value : null); };
      r.onerror = function () { reject(r.error); };
    });
  }

  function qDel(key) {
    if (useMem) { memQueue = memQueue.filter(function (x) { return x.key !== key; }); return Promise.resolve(); }
    return new Promise(function (resolve, reject) {
      const t = db.transaction(STORE, 'readwrite');
      t.objectStore(STORE).delete(key);
      t.oncomplete = function () { resolve(); };
      t.onerror = function () { reject(t.error); };
    });
  }

  function qCount() {
    if (useMem) return Promise.resolve(memQueue.length);
    return new Promise(function (resolve, reject) {
      const r = db.transaction(STORE, 'readonly').objectStore(STORE).count();
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }

  /* ---------- 裏で送信 ---------- */
  let working = false;
  let sending = false;
  let waitTimer = null;
  let failCount = 0;
  let lastError = '';
  let pendingCount = 0;

  async function updateStatus() {
    try { pendingCount = await qCount(); } catch (e) {}
    const box = $('queue');
    const btn = $('qRetry');
    if (pendingCount === 0) {
      box.className = 'idle';
      $('qText').textContent = '送信待ちはありません';
      btn.style.display = 'none';
    } else if (lastError && !sending) {
      box.className = 'fail';
      $('qText').textContent = '未送信 ' + pendingCount + '件：' + lastError + '（自動で再送信します）';
      btn.style.display = 'block';
    } else {
      box.className = 'busy';
      $('qText').textContent = '送信中… 残り ' + pendingCount + '件';
      btn.style.display = 'none';
    }
  }

  async function kick() {
    if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
    if (working) return;
    working = true;
    try {
      while (true) {
        const item = await qFirst();
        if (!item) break;
        sending = true;
        await updateStatus();
        try {
          await post({ action: 'photos', staff: item.staff, id: item.id, images: item.images });
          await qDel(item.key);
          failCount = 0;
          lastError = '';
        } catch (e) {
          failCount++;
          lastError = e.message || '送信に失敗しました';
          sending = false;
          const delay = Math.min(60, 5 * Math.pow(2, failCount - 1)) * 1000;
          waitTimer = setTimeout(kick, delay);
          break;
        }
      }
    } finally {
      working = false;
      sending = false;
      await updateStatus();
    }
  }

  $('qRetry').onclick = function () { failCount = 0; kick(); };
  window.addEventListener('online', function () { kick(); });

  /* ---------- 初期設定 ---------- */
  function showSetup() {
    stopCamera();
    $('main').style.display = 'none';
    $('setup').style.display = 'block';
    $('inStaff').value = load('kk_staff');
  }

  $('setupSave').onclick = async function () {
    const code = $('inStaff').value.trim().toLowerCase();
    const m = $('setupMsg');
    if (!code) {
      m.textContent = '撮影者コードを入力してください';
      m.className = 'err';
      return;
    }
    m.textContent = '確認中…';
    m.className = '';
    try {
      const j = await post({ action: 'check', staff: code }, 30000);
      store('kk_staff', code);
      store('kk_name', j.name || code);
      showMain();
    } catch (e) {
      m.textContent = e.message;
      m.className = 'err';
    }
  };

  $('toSetup').onclick = function () {
    if (shots.length && !confirm('撮影中の写真は消えます。設定画面に移りますか？')) return;
    shots = [];
    render();
    showSetup();
  };

  /* ---------- カメラ ---------- */
  let stream = null;

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 4032 }, height: { ideal: 3024 } },
        audio: false
      });
      v.srcObject = stream;
      await v.play();
      if (!shots.length) msg(useMem
        ? '撮影できます。※この端末では一時保存が使えないため、送信が終わるまで画面を閉じないでください。'
        : '撮影できます。最大10枚まで撮れます。', useMem ? 'err' : '');
    } catch (e) {
      msg('カメラを起動できませんでした（' + e.name + '）。iPhoneの設定でSafariのカメラを「許可」にしてください。', 'err');
    }
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      kick();
      if ($('main').style.display !== 'none') {
        const live = stream && stream.getVideoTracks().some(function (t) { return t.readyState === 'live'; });
        if (!live) startCamera();
      }
    }
  });

  function showMain() {
    $('setup').style.display = 'none';
    $('main').style.display = 'block';
    updateWho();
    render();
    startCamera();
  }

  function updateWho() {
    $('who').textContent = '担当：' + (load('kk_name') || load('kk_staff')) + '　本日 ' + todayCount() + '件';
  }

  /* ---------- 撮影 ---------- */
  $('shutter').onclick = function () {
    if (shots.length >= MAX) return;
    const w = v.videoWidth, h = v.videoHeight;
    if (!w) return;
    const side = Math.min(w, h);
    const out = Math.min(SIZE, side);
    const c = document.createElement('canvas');
    c.width = out;
    c.height = out;
    c.getContext('2d').drawImage(v, (w - side) / 2, (h - side) / 2, side, side, 0, 0, out, out);
    shots.push(c.toDataURL('image/jpeg', 0.85));
    const f = $('flash');
    f.style.opacity = '0.7';
    setTimeout(function () { f.style.opacity = '0'; }, 80);
    render();
  };

  function render() {
    const box = $('thumbs');
    box.innerHTML = '';
    shots.forEach(function (url, i) {
      const d = document.createElement('div');
      d.className = 't';
      const img = document.createElement('img');
      img.src = url;
      const n = document.createElement('span');
      n.textContent = i + 1;
      const x = document.createElement('button');
      x.textContent = '×';
      x.setAttribute('aria-label', (i + 1) + '枚目を削除');
      x.onclick = function () {
        if (confirm((i + 1) + '枚目を削除しますか？')) { shots.splice(i, 1); render(); }
      };
      d.appendChild(img);
      d.appendChild(n);
      d.appendChild(x);
      box.appendChild(d);
    });
    $('count').textContent = shots.length + ' / ' + MAX + '枚';
    $('shutter').disabled = shots.length >= MAX;
    $('save').disabled = shots.length === 0;
  }

  /* ---------- 保存（受付して次へ） ---------- */
  $('save').onclick = async function () {
    if (!shots.length) return;
    $('save').disabled = true;
    const item = {
      key: String(Date.now()).padStart(15, '0') + '_' + newId(),
      id: newId(),
      staff: load('kk_staff'),
      images: shots.slice(),
      createdAt: Date.now()
    };
    try {
      await qAdd(item);
    } catch (e) {
      msg('端末への一時保存に失敗しました：' + e.message, 'err');
      $('save').disabled = false;
      return;
    }
    const n = shots.length;
    shots = [];
    addToday();
    updateWho();
    render();
    msg('受け付けました（' + n + '枚）。続けて次の商品を撮影できます。送信は自動で行います。', 'ok');
    await updateStatus();
    kick();
  };

  window.addEventListener('beforeunload', function (e) {
    if (shots.length || pendingCount > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------- 開始 ---------- */
  (async function init() {
    try { db = await openDB(); } catch (e) { useMem = true; }
    if (load('kk_staff')) showMain(); else showSetup();
    await updateStatus();
    kick();
  })();
</script>
</body>
</html>
